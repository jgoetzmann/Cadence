[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cadence*"]

[project]
name = "cadence"
version = "1.0.0"
description = "Self-hosted Discord music bot"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "davey",
    "yt-dlp>=2025.5.22",
    "bgutil-ytdlp-pot-provider>=1.0.0",
    "PyNaCl>=1.5",
    "python-dotenv>=1.0",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["bot.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=cadence --cov-report=term-missing"

[tool.coverage.run]
source = ["cadence"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
